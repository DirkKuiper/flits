name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run test suite
        run: python -m pytest -q

  wheel-platforms:
    name: wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and install the wheel
        shell: python {0}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          destination = Path(os.environ["RUNNER_TEMP"]) / "wheel-dist"
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--upgrade", "pip", "build"])
          subprocess.check_call([sys.executable, "-m", "build", "--wheel", "--outdir", str(destination)])
          wheels = list(destination.glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheels[0]), "pytest"])

      - name: Exercise the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        shell: python {0}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          source = Path(os.environ["GITHUB_WORKSPACE"])
          subprocess.check_call([
            sys.executable, str(source / ".github" / "scripts" / "wheel_smoke.py"),
            "--source-root", str(source), "--output", "wheel-smoke.json",
          ])

      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/wheel-smoke.json
            ${{ runner.temp }}/wheel-smoke-server.log
          if-no-files-found: warn

  browser:
    # The interface is how FLITS is used, and it is the largest surface the unit
    # tests cannot reach. These drive a real browser against a real server.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-playwright
          python -m pip install -e .

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python -m pytest tests/test_frontend_e2e.py -q -m e2e

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6" "mypy>=1.11"
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: |
          python -m mypy
          python -m mypy .github/scripts/wheel_smoke.py

  minimum-versions:
    # Prove that the lower bounds declared in pyproject.toml are real: install
    # the oldest permitted release of every direct runtime dependency and run
    # the suite against it. The fitburst parity tests skip because fitburst,
    # a test-only dependency, is not installed here.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum supported dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.115.0" \
            "uvicorn==0.30.0" \
            "numpy==1.26.0" \
            "scipy==1.11.4" \
            "astropy==6.0.0" \
            "pydantic==2.7.0" \
            "your==0.6.7" \
            "matplotlib==3.8.0" \
            "h5py==3.10.0" \
            "pytest>=8.3" \
            "httpx>=0.27"
          python -m pip install --no-deps -e .

      - name: Run test suite
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  container:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - wheel-platforms
      - container-arm64

    steps:
      - name: Require unit and platform checks to pass
        env:
          UNIT_RESULT: ${{ needs.test.result }}
          WHEEL_RESULT: ${{ needs.wheel-platforms.result }}
          ARM_RESULT: ${{ needs.container-arm64.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$WHEEL_RESULT" = success
          test "$ARM_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t flits-ci .

      - name: Smoke test container image
        run: |
          mkdir -p "$RUNNER_TEMP/container-evidence"
          docker run --rm --workdir /tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/smoke-source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/container-evidence,target=/evidence" \
            flits-ci sh -c 'python -m pip install pytest && python /smoke-source/.github/scripts/wheel_smoke.py --source-root /smoke-source --output /evidence/wheel-smoke.json'

      - name: Retain container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-amd64
          path: ${{ runner.temp }}/container-evidence
          if-no-files-found: warn

  container-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build container natively on ARM64
        run: docker build -t flits-ci .
      - name: Exercise the installed container package
        run: |
          mkdir -p "$RUNNER_TEMP/container-evidence"
          docker run --rm --workdir /tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/smoke-source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/container-evidence,target=/evidence" \
            flits-ci sh -c 'python -m pip install pytest && python /smoke-source/.github/scripts/wheel_smoke.py --source-root /smoke-source --output /evidence/wheel-smoke.json'
      - name: Retain ARM64 container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-arm64
          path: ${{ runner.temp }}/container-evidence
          if-no-files-found: warn
