name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-full.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run test suite
        run: python -m pytest -q

  browser:
    # The interface is how FLITS is used, and it is the largest surface the unit
    # tests cannot reach. These drive a real browser against a real server.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-playwright
          python -m pip install -e .

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: python -m pytest tests/test_frontend_e2e.py -q -m e2e

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.6" "mypy>=1.11"
          python -m pip install -e .

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

  minimum-versions:
    # Prove that the lower bounds declared in pyproject.toml are real: install
    # the oldest permitted release of every direct runtime dependency and run
    # the suite against it. fitburst-dependent tests are excluded because the
    # optional model-fitting extra is not installed here.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum supported dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.115.0" \
            "uvicorn==0.30.0" \
            "numpy==1.26.0" \
            "scipy==1.11.4" \
            "astropy==6.0.0" \
            "pydantic==2.7.0" \
            "your==0.6.7" \
            "jess==0.3.1" \
            "matplotlib==3.8.0" \
            "h5py==3.10.0" \
            "pytest>=8.3" \
            "httpx>=0.27"
          python -m pip install --no-deps -e .

      - name: Run test suite
        run: python -m pytest -q --ignore=tests/test_model_fitting.py

  package:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  container:
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build -t flits-ci .

      - name: Smoke test container image
        run: docker run --rm flits-ci flits --help
