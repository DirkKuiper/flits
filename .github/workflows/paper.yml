name: JOSS Paper

on:
  push:
    paths:
      - "paper/**"
      - "CITATION.cff"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "CITATION.cff"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate manuscript and citation metadata
        run: |
          python -m pip install -r paper/requirements.txt
          python paper/check.py
          cffconvert --validate

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      - name: Upload draft PDF
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf

      - name: Build and verify arXiv source archive
        run: |
          docker pull openjournals/inara@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62
          python paper/build_arxiv.py

      - name: Upload arXiv package
        uses: actions/upload-artifact@v7
        with:
          name: arxiv
          path: |
            output/arxiv/flits-arxiv-source.zip
            output/arxiv/flits-arxiv.pdf
            output/arxiv/build-report.json
