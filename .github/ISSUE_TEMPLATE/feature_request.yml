name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the analysis problem, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like FLITS to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Another tool, a script, a manual step — this helps judge the gap.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >
            This is about analysing a burst I already have, not about searching
            for or detecting candidates (which is out of scope for FLITS).
          required: true
