site_name: FLITS
site_description: Interactive and scriptable fast radio burst (FRB) analysis software
site_url: https://dirkkuiper.github.io/flits/
repo_url: https://github.com/DirkKuiper/flits
repo_name: DirkKuiper/flits
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: cyan

plugins:
  - search
  # Publishes llms.txt and llms-full.txt, plain-Markdown indexes of these docs
  # for language-model tools (https://llmstxt.org).
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        FLITS (Fast-Look Interactive Transient Suite) measures fast radio bursts
        (FRBs) in dynamic spectra: SIGPROC filterbank (.fil), PSRFITS (.fits,
        .sf) and CHIME/FRB HDF5 (.h5) files. It masks interference, localizes
        the burst in time and frequency, optimizes the DM, and measures S/N,
        peak flux, fluence, widths, arrival times, sub-burst drift rate and
        rotation measure, with each uncertainty classified. It starts from a
        burst you already have; it is not a search pipeline.

        Install with `pip install flits` (Python 3.11+). Three ways to use it:

        - `flits measure FILE... --dm DM` measures bursts without a browser and
          prints JSON (or `--format jsonl|csv`). Pin choices with `--event`,
          `--offpulse`, `--band` or `--crop`. Save sessions with
          `--snapshot-dir`. Exit code 0 means every burst was measured.
        - Python: `flits.BurstSession.from_file(path, dm=...)`, then
          `auto_mask()`, `auto_localize()` and `compute_properties()`;
          or `flits.measure_burst(path, flits.MeasureOptions(dm=...))`.
        - `flits --data-dir DIR` serves the browser interface; `flits demo`
          opens a prepared example burst.

        Sessions are saved as JSON snapshots; `flits replay SNAPSHOT --check`
        recomputes their measurements from the original data.
      sections:
        Getting started:
          - getting-started.md: Install FLITS, try the demo, and load a burst
          - guided-workflow.md: A complete worked example on a public GBT burst, with reference values
          - installation.md: Python, Docker, Apptainer, and remote or HPC deployment
        Scripting:
          - user-guide/inspection.md: Inspect file metadata and verify local and server runtime identities
          - user-guide/headless-measurement.md: Measure bursts from the command line or Python, in batches
          - user-guide/automation-contracts.md: Per-burst JSON manifests and versioned offline output schemas
          - user-guide/headless-replay.md: Recompute and check a saved session without a browser
          - user-guide/coding-agents.md: Have coding agents use FLITS, with the FLITS skill
          - developer/api-reference.md: The Python API, BurstSession first
        User guide:
          - user-guide/session-workflow.md: Working through a session in the interface
          - user-guide/exports-and-snapshots.md: Export bundles, session snapshots, and provenance
          - user-guide/uncertainties.md: What each kind of uncertainty is and how to add missing terms
          - user-guide/supported-formats.md: Supported file formats and telescope presets
        Analysis methods:
          - analysis/*.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started.md
      - Guided Workflow: guided-workflow.md
      - Installation and Deployment: installation.md
  - User Guide:
      - Session Workflow: user-guide/session-workflow.md
      - Exports and Snapshots: user-guide/exports-and-snapshots.md
      - Uncertainties: user-guide/uncertainties.md
      - Headless Measurement: user-guide/headless-measurement.md
      - Inspection and Runtime: user-guide/inspection.md
      - Batch Manifests and Schemas: user-guide/automation-contracts.md
      - Headless Replay: user-guide/headless-replay.md
      - Coding Agents: user-guide/coding-agents.md
      - Supported Formats: user-guide/supported-formats.md
  - Analysis:
      - Burst Localization: analysis/localization.md
      - Measurements: analysis/measurements.md
      - DM Optimization: analysis/dm-optimization.md
      - Temporal and Spectral Analysis: analysis/temporal-spectral.md
      - Sub-Burst Drift: analysis/drift.md
      - Multiscale Temporal Power: analysis/temporal-multiscale.md
      - Rotation-Measure Synthesis: analysis/rm-synthesis.md
      - Model Fitting: analysis/model-fitting.md
  - Reference:
      - Python API: developer/api-reference.md
      - References: references.md
  - Developer:
      - Testing: developer/testing.md
      - Agent Evaluations: developer/agent-evaluations.md
      - JOSS Manuscript: developer/joss-submission.md
      - Publishing: developer/publishing.md
      - Custom Readers: developer/custom-readers.md
